# AMS Data Hub: manual-only merge gates and exact-main registry release.
# SourceCraft defaults missing `on` to push. Empty path filters are the explicit
# never-trigger sentinel; headless manual runs remain available.
on:
  push:
    - workflows: [merge-standard, merge-risky, release]
      filter:
        paths: []
  pull_request:
    - workflows: [merge-standard, merge-risky, release]
      filter:
        paths: []

workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Full reviewed Pull Request head SHA"
      unit_test_files:
        type: string
        required: true
        description: "Comma-separated relevant unit test files"
      changed_paths:
        type: string
        required: true
        description: "Comma-separated changed paths for the non-authoritative risk hint"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 30m
    tasks:
      - name: exact-head-standard
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          UNIT_TEST_FILES: ${{ inputs.unit_test_files }}
          CHANGED_PATHS: ${{ inputs.changed_paths }}
        cubes:
          - name: verify
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - pnpm install --frozen-lockfile
              - node scripts/ci/verify-exact-head.mjs
              - node scripts/ci/classify-risk.mjs
              - pnpm security:secrets
              - pnpm verify:quick
              - node scripts/ci/run-scoped-proof.mjs unit

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Full reviewed Pull Request head SHA"
      unit_test_files:
        type: string
        required: true
        description: "Comma-separated relevant unit test files"
      changed_paths:
        type: string
        required: true
        description: "Comma-separated changed paths for the non-authoritative risk hint"
      integration_test_files:
        type: string
        required: true
        description: "Comma-separated relevant integration tests, or none"
      run_dependency_scan:
        type: string
        required: true
        description: "true only when a dependency artifact changed; otherwise false"
      run_build:
        type: string
        required: true
        description: "true only when the reviewed risk requires a production build"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 70m
    tasks:
      - name: exact-head-risky
        env:
          APP_ENV: test
          LOCAL_POSTGRES_USER: ams_data_hub_local
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          UNIT_TEST_FILES: ${{ inputs.unit_test_files }}
          CHANGED_PATHS: ${{ inputs.changed_paths }}
          INTEGRATION_TEST_FILES: ${{ inputs.integration_test_files }}
          RUN_DEPENDENCY_SCAN: ${{ inputs.run_dependency_scan }}
          RUN_BUILD: ${{ inputs.run_build }}
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: ams_data_hub_test
          TEST_DATABASE_PASSWORD: ams_data_hub_test
          TEST_DATABASE_NAME: ams_data_hub_ci_test
          TEST_DATABASE_SSLMODE: disable
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_USER: ams_data_hub_local
          DATABASE_PASSWORD: ams_data_hub_local
          DATABASE_NAME: ams_data_hub_dev
          DATABASE_SSLMODE: disable
          DATABASE_URL: postgresql://ams_data_hub_local:ams_data_hub_local@127.0.0.1:5432/ams_data_hub_dev?sslmode=disable
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-1234567890
          BETTER_AUTH_URL: http://127.0.0.1:3100
        cubes:
          - name: verify
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - pnpm install --frozen-lockfile
              - node scripts/verify-release-runtime.mjs
              - bash scripts/ci/prepare-scoped-risk-environment.sh
              - node scripts/ci/verify-exact-head.mjs
              - node scripts/ci/classify-risk.mjs
              - pnpm security:secrets
              - pnpm verify:quick
              - node scripts/ci/run-scoped-proof.mjs unit
              - node scripts/ci/run-scoped-proof.mjs integration
              - node scripts/ci/run-scoped-proof.mjs optional-risk

  release:
    inputs:
      release_commit_sha:
        type: string
        required: true
        description: "Exact final SourceCraft main SHA"
      verified_gate_commit_sha:
        type: string
        required: true
        description: "Exact successful RISKY gate SHA"
      verified_gate_run_slug:
        type: string
        required: true
        description: "Successful SourceCraft gate run slug verified before release"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 90m
    tasks:
      - name: exact-main-registry-release
        env:
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
          VERIFIED_GATE_COMMIT_SHA: ${{ inputs.verified_gate_commit_sha }}
          VERIFIED_GATE_RUN_SLUG: ${{ inputs.verified_gate_run_slug }}
          SOURCECRAFT_REGISTRY_PAT: ${{ secrets.SOURCECRAFT_REGISTRY_PAT }}
        cubes:
          - name: build-once-and-publish
            script:
              - chmod +x scripts/ci/sourcecraft-publish-images.sh
              - bash scripts/ci/sourcecraft-publish-images.sh
            artifacts:
              paths:
                - .release-artifacts/registry-manifest.json
