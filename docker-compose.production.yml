x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *runtime-hardening
    image: ${AMS_START_WEB_IMAGE:?Set AMS_START_WEB_IMAGE}
    restart: always
    network_mode: host
    env_file:
      - path: /etc/ams-platform/ams-start-web.env
        required: false
      - path: /opt/ams-platform/ams-start/shared/release.env
        required: false
    environment:
      APP_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: 3000
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    <<: *runtime-hardening
    image: ${AMS_START_WORKER_IMAGE:?Set AMS_START_WORKER_IMAGE}
    restart: always
    network_mode: host
    env_file:
      - path: /etc/ams-platform/ams-start-worker.env
        required: false
      - path: /opt/ams-platform/ams-start/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production
      OUTBOX_WORKER_ID: ${OUTBOX_WORKER_ID:?Set a host-unique OUTBOX_WORKER_ID}
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    <<: *runtime-hardening
    image: ${AMS_START_MIGRATOR_IMAGE:?Set AMS_START_MIGRATOR_IMAGE}
    restart: "no"
    network_mode: host
    profiles: ["manual"]
    env_file:
      - path: /etc/ams-platform/ams-start-migrator.env
        required: false
      - path: /opt/ams-platform/ams-start/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production

  maintenance:
    <<: *runtime-hardening
    image: ${AMS_START_WORKER_IMAGE:?Set AMS_START_WORKER_IMAGE}
    command: ["outbox-retention"]
    restart: "no"
    network_mode: host
    profiles: ["manual"]
    env_file:
      - path: /etc/ams-platform/ams-start-worker.env
        required: false
      - path: /opt/ams-platform/ams-start/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production
