services:
  web:
    image: ${AMS_START_IMAGE:?Set AMS_START_IMAGE}
    command: ["web"]
    restart: always
    network_mode: host
    env_file:
      - path: /etc/ams-platform/ams-start-web.env
        required: false
      - path: /opt/ams-platform/ams-start/shared/release.env
        required: false
    environment:
      APP_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: 3000
      NODE_ENV: production

  worker:
    image: ${AMS_START_IMAGE:?Set AMS_START_IMAGE}
    command: ["outbox-worker"]
    restart: always
    network_mode: host
    env_file:
      - path: /etc/ams-platform/ams-start-worker.env
        required: false
      - path: /opt/ams-platform/ams-start/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production
      OUTBOX_WORKER_ID: ams-start-outbox

  migrate:
    image: ${AMS_START_IMAGE:?Set AMS_START_IMAGE}
    command: ["migrate"]
    restart: "no"
    network_mode: host
    profiles: ["manual"]
    env_file:
      - path: /etc/ams-platform/ams-start-migrator.env
        required: false
      - path: /opt/ams-platform/ams-start/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production

  maintenance:
    image: ${AMS_START_IMAGE:?Set AMS_START_IMAGE}
    command: ["outbox-retention"]
    restart: "no"
    network_mode: host
    profiles: ["manual"]
    env_file:
      - path: /etc/ams-platform/ams-start-worker.env
        required: false
      - path: /opt/ams-platform/ams-start/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production
